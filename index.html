<!doctype html>

    <style>
      :root{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#173154;background:#f4f8fc}*{box-sizing:border-box}body{margin:0}.wrap{width:min(1100px,calc(100% - 32px));margin:0 auto;padding:72px 0}.eyebrow{color:#1769b0;font-size:12px;font-weight:700;letter-spacing:.12em}.badge{display:inline-flex;margin-top:16px;padding:5px 8px;border:1px solid #1769b0;border-radius:5px;color:#1769b0;font-size:12px;font-weight:700}.hero{max-width:720px}.hero h1{margin:10px 0;font-size:clamp(32px,5vw,52px);letter-spacing:-.05em}.hero p{color:#6b7e98;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(2,minmax(min(280px,100%),1fr));gap:18px;margin-top:44px}.card{display:block;padding:26px;border:1px solid #d7e3f0;border-radius:14px;background:#fff;box-shadow:0 8px 24px rgba(23,49,84,.08);color:inherit;text-decoration:none}.card:hover{border-color:#8dbde0;transform:translateY(-2px)}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:10px;background:#ddecfb;color:#1769b0;font-weight:800}.card h2{margin:18px 0 8px}.card p{margin:0;color:#6b7e98;line-height:1.65}@media(max-width:620px){.wrap{padding-top:42px}.grid{grid-template-columns:1fr}}
